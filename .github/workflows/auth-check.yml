name: Check npm publication secret availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check inherited publication secret without publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is unavailable to this repository. An npm administrator must grant the repository access or configure a trusted publisher."
            exit 1
          fi
          echo "NPM_TOKEN is available to this repository."
          if ! npm whoami; then
            echo "Account identity is unavailable. Since August 2026, bypass-2FA tokens cannot perform account-identity actions; this does not determine publication permission."
          fi
